name: brownout
description: Partial outage. Slow, and 10% of requests fail - quick 503s plus gateway timeouts that hang for 10 seconds.
latency:
  type: lognormal
  p50Ms: 600
  p95Ms: 2500
  capMs: 8000
errors:
  rate: 0.10
  responses:
    - status: 503
      body: '{"error":"service_unavailable"}'
      latencyMs: 20
      weight: 3
    - status: 504
      body: '{"error":"gateway_timeout"}'
      latencyMs: 10000
      weight: 1
